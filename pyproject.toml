[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astragrid"
version = "0.1.0"
description = "Fault-aware lunar habitat resource-management simulation prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2.6,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.scripts]
astragrid = "astra_grid.cli:main"

[tool.setuptools.packages.find]
include = ["astra_grid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
